<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Triumph Training Employee Portal</title>

  <link rel="stylesheet" href="style.css?v=7">
</head>

<body>

  <div class="portal">

    <img
      src="logo.png"
      class="logo"
      alt="Triumph Training Logo">

    <h1>Triumph Training Employee Portal</h1>

    <p class="subtitle">
      Employee Clock In System
    </p>

    <div class="clock-card">

      <div id="liveTime" aria-live="off">
        --:-- --
      </div>

      <div id="liveDate">
        Loading date...
      </div>

    </div>

    <select id="name" aria-label="Employee name">
      <option value="">Loading employees...</option>
    </select>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="4"
      placeholder="Enter 4-digit PIN"
      aria-label="Employee 4-digit PIN"
      autocomplete="current-password"
      enterkeyhint="done">

    <div class="buttons">

      <button
        type="button"
        class="clock-in"
        data-punch-action
        onclick="clockIn()">

        Clock In

      </button>

      <button
        type="button"
        class="clock-out"
        data-punch-action
        onclick="clockOut()">

        Clock Out

      </button>

    </div>

    <button
      type="button"
      class="missed-button"
      data-punch-action
      onclick="missedClockOut()">

      Missed Clock Out

    </button>

    <p id="status" role="status" aria-live="polite"></p>

  </div>

  <script src="script.js?v=5"></script>

</body>

</html>
