<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Triumph Training Employee Portal</title>
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="stylesheet" href="employee.css?v=1">
</head>

<body class="employee-page">
  <main class="employee-shell" aria-label="Triumph Training employee clock portal">
    <section class="portal employee-portal">
      <header class="employee-brand">
        <img src="logo.png" class="logo" alt="Triumph Training Logo">
        <div class="employee-brand-copy">
          <p class="employee-eyebrow">Employee Portal</p>
          <h1>Triumph Training</h1>
          <p class="subtitle">Fast, secure attendance clock</p>
        </div>
      </header>

      <div class="employee-top-grid">
        <div class="clock-card" aria-label="Current local time">
          <div id="liveTime" aria-live="off">--:-- --</div>
          <div id="liveDate">Loading date...</div>
        </div>

        <div id="portalReadyPill" class="employee-ready-pill" aria-live="polite">
          <span class="employee-ready-dot" aria-hidden="true"></span>
          <span id="portalReadyText">Connecting</span>
        </div>
      </div>

      <div class="employee-form-card">
        <div class="employee-field">
          <label for="name">
            Employee
            <span class="employee-field-hint">Step 1</span>
          </label>
          <select id="name" aria-label="Employee name">
            <option value="">Loading employees...</option>
          </select>
        </div>

        <div class="employee-field">
          <label for="pin">
            4-digit PIN
            <span class="employee-field-hint">Step 2</span>
          </label>
          <input
            id="pin"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="4"
            placeholder="Enter PIN"
            aria-label="Employee 4-digit PIN"
            autocomplete="current-password"
            enterkeyhint="done">
        </div>

        <div class="employee-actions" aria-label="Clock actions">
          <button
            type="button"
            class="clock-in employee-action-button"
            data-punch-action
            data-action="Clock In"
            onclick="clockIn()">
            <span class="employee-button-icon" aria-hidden="true">→</span>
            <span class="employee-button-label">Clock In</span>
          </button>

          <button
            type="button"
            class="clock-out employee-action-button"
            data-punch-action
            data-action="Clock Out"
            onclick="clockOut()">
            <span class="employee-button-icon" aria-hidden="true">←</span>
            <span class="employee-button-label">Clock Out</span>
          </button>
        </div>

        <div class="employee-secondary-row">
          <button
            type="button"
            class="missed-button"
            data-punch-action
            data-action="Missed Clock Out"
            onclick="missedClockOut()">
            <span class="employee-button-icon" aria-hidden="true">!</span>
            <span class="employee-button-label">Missed Clock Out</span>
          </button>
        </div>
      </div>

      <div id="employeeStatusCard" class="employee-status-card" role="status" aria-live="polite" aria-atomic="true">
        <div class="employee-status-icon" aria-hidden="true">
          <span id="employeeStatusSymbol" class="employee-status-symbol">•</span>
        </div>
        <div class="employee-status-copy">
          <p id="employeeStatusLabel" class="employee-status-label">Status</p>
          <p id="status">Select your name to begin.</p>
        </div>
      </div>

      <p class="employee-footer-note">Select your name, enter your PIN, then choose one action. Please wait for confirmation before leaving the portal.</p>
    </section>
  </main>

  <script src="script.js?v=6"></script>
</body>
</html>
