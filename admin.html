<!DOCTYPE html>
<html>

<head>
  <title>Triumph Training Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="portal admin-portal">

    <img src="logo.png" class="logo" alt="Triumph Training Logo">

    <h1>Admin Dashboard</h1>

    <p class="subtitle">
      Triumph Training Management View
    </p>

    <div id="loginPanel">
      <input
        id="adminPin"
        type="password"
        inputmode="numeric"
        placeholder="Enter Admin PIN">

      <button class="clock-in admin-unlock" onclick="unlockAdmin()">
        Unlock Dashboard
      </button>
    </div>

    <p id="status"></p>

    <div id="dashboard" style="display: none;">

      <div class="admin-actions">
        <button class="admin-small-button" onclick="loadAdminDashboard()">
          Refresh Dashboard
        </button>
      </div>

      <div class="admin-grid">
        <div class="admin-card">
          <h2>Currently Clocked In</h2>
          <div id="clockedInList" class="admin-list">
            Loading...
          </div>
        </div>

        <div class="admin-card">
          <h2>Payroll Snapshot</h2>
          <div id="payrollSummary" class="admin-list">
            Loading...
          </div>
        </div>

        <div class="admin-card">
          <h2>Employee Pay Rates</h2>
          <div id="employeeRates" class="admin-list">
            Loading...
          </div>
        </div>

        <div class="admin-card">
          <h2>Admin Analytics</h2>
          <div id="analyticsBox" class="admin-list">
            Loading...
          </div>
        </div>
      </div>

      <div class="admin-card full-width-card">
        <h2>Missed Punch Requests</h2>
        <div id="missedPunchRequests" class="admin-list">
          Loading...
        </div>
      </div>

      <div class="admin-card full-width-card">
        <h2>Recent Punches</h2>
        <div id="recentPunches" class="admin-list">
          Loading...
        </div>
      </div>

    </div>

  </div>

  <script src="admin.js"></script>

</body>
</html>
