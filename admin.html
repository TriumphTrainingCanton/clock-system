<!DOCTYPE html>
<html>

<head>
  <title>Triumph Training Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="portal">

    <img src="logo.png" class="logo" alt="Triumph Training Logo">

    <h1>Admin Dashboard</h1>

    <p class="subtitle">
      Triumph Training Management View
    </p>

    <input
      id="adminPin"
      type="password"
      inputmode="numeric"
      placeholder="Enter Admin PIN">

    <button class="clock-in" onclick="unlockAdmin()">
      Unlock Dashboard
    </button>

    <p id="status"></p>
<div id="dashboard" style="display: none;">

  <div class="admin-section">
    <h2>Currently Clocked In</h2>
    <div id="clockedInList">
      Loading...
    </div>
  </div>

  <div class="admin-section">
    <h2>Admin Tools</h2>
    <p>
      Weekly totals and monthly payroll are available in the connected Google Sheet.
    </p>
  </div>

</div>

  </div>

  <script src="admin.js"></script>

</body>
</html>
